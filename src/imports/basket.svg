 <linearGradient id="rim-top" x1="0" y1="0" x2="1" y2=".25"><stop offset="0%" stop-color="#fbfcfd"/><stop offset="30%" stop-color="#caced4"/><stop offset="55%" stop-color="#aab0b9"/><stop offset="100%" stop-color="#e6e9ed"/></linearGradient>
